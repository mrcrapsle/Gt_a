name: Update-Suche (Leonida Vault)

on:
  schedule:
    - cron: "17 5 * * *"   # täglich, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Quellen abfragen
        run: node scripts/find-updates.mjs

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update-Suche: Kandidaten aktualisiert"
            git push
          fi
